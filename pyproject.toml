[project]
name = "iscc-sdk"
version = "0.9.5"
description = "SDK for creating ISCCs (International Standard Content Codes)"
authors = [{ name = "Titusz", email = "tp@py7.de" }]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "iscc",
    "identifier",
    "media",
    "content",
    "similarity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "blake3",
    "loguru",
    "bitarray",
    "xxhash",
    "iscc-schema>=0.8.0",
    "python-magic-pure",
    "platformdirs",
    "jmespath",
    "Pillow",
    "pytaglib",
    "numpy",
    "pypdf",
    "ebookmeta",
    "python-docx",
    "typer",
    "pillow-heif",
    "langcodes",
    "exiv2",
    "iscc-tika",
    "bleach",
    "pillow-avif-plugin",
    "iscc-lib",
    "pydantic-settings",
    "pypdfium2",
    "resvg_py",
]

[project.optional-dependencies]
sci = [
    "iscc-sci[cpu]",
]
sct = [
    "iscc-sct[cpu]",
]

[project.urls]
Homepage = "https://sdk.iscc.codes"
Repository = "https://github.com/iscc/iscc-sdk"
Changelog = "https://sdk.iscc.codes/changelog"
Coverage = "https://app.codecov.io/gh/iscc/iscc-sdk"
"Bug Tracker" = "https://github.com/iscc/iscc-sdk/issues"
Twitter = "https://twitter.com/iscc_foundation"
Donate = "https://iscc.foundation/support"

[project.scripts]
iscc-sdk = "iscc_sdk.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "zuban",
    "ruff",
    "coverage",
    "pytest-cov",
    "pytest-timeout",
    "poethepoet",
    "mkdocs-material",
    "mkdocstrings[python]",
    "iscc-samples",
    "codetiming",
    "mdformat",
    "mdformat_admon",
    "mdformat_tables",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.mypy]
ignore_missing_imports = true
# typeshed declares io.BytesIO as inheriting abstract methods from BinaryIO/IOBase
# via Generic[AnyStr], which zuban's default "typed" mode reports as a false positive
# on every io.BytesIO(...) call. mypy mode does not flag these.
disable_error_code = ["abstract"]

[[tool.mypy.overrides]]
module = "iscc_sdk.monkeys"
ignore_errors = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Rules from the ruff >= 0.16 expanded default set that conflict with established code
# patterns in this codebase. Kept ignored to avoid unrelated churn; revisit separately.
ignore = [
    "B005",    # strip-with-multi-characters (loose test assertions)
    "B018",    # useless-expression (attribute access in tests)
    "BLE001",  # blind-except (deliberate graceful degradation)
    "C408",    # unnecessary-collection-call (established dict() call style)
    "PERF402", # manual-list-copy
    "PLC0206", # dict-index-missing-items
    "PLW1510", # subprocess-run-without-check (return codes handled explicitly)
    "RUF059",  # unused-unpacked-variable
    "SIM102",  # collapsible-if
    "SIM103",  # needless-bool
    "SIM115",  # open-file-with-context-handler
    "SIM117",  # multiple-with-statements
    "SIM118",  # in-dict-keys
    "SIM201",  # negate-equal-op
    "TRY002",  # raise-vanilla-class
]

[tool.ruff.lint.mccabe]
max-complexity = 13

[tool.ruff.lint.per-file-ignores]
"iscc_sdk/__init__.py" = ["E402", "F401", "F403", "I001"]
"iscc_sdk/tools.py" = ["S101", "S202", "S310", "S603"]
"iscc_sdk/epub.py" = ["C901"]
"iscc_sdk/main.py" = ["C901"]

[tool.coverage.run]
omit = ["iscc_sdk/install.py"]

[tool.poe.tasks]
lint = { cmd = "prek run --all-files", help = "Run all pre-commit hooks (formatting, linting)" }
build-docs = { cmd = "uv run python -m devtools.build_docs", help = "Copy README.md to /docs" }
test = { cmd = "uv run pytest --cov=iscc_sdk --cov-fail-under=100 -p no:warnings", help = "Run tests with coverage" }
all = ["lint", "build-docs", "test"]
